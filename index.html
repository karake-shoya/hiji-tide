<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日出の潮 | 大分県日出町の潮見表と釣りどき</title>
<meta name="description" content="大分県日出町（別府湾）の満潮・干潮と、潮の動き・マズメから割り出した釣りどきの時間帯。いま行くべきかが一目で分かります。釣りを始めたばかりの方向け。">
<link rel="canonical" href="https://hiji-tide.vercel.app/">
<meta name="theme-color" content="#062029" id="themeColor">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hiji-tide.vercel.app/">
<meta property="og:title" content="日出の潮 | 大分県日出町の潮見表と釣りどき">
<meta property="og:description" content="別府湾の満潮・干潮と、潮とマズメから見た釣りどき。いま行くべきかが一目で分かります。">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://hiji-tide.vercel.app/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="日出の潮。潮位カーブに釣りどきの時間帯が重ねてある">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日出の潮">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/css/style.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">日出の潮<span>大分県日出町・別府湾</span></div>
</header>

<noscript>
  <p style="padding:16px;line-height:1.8">このページは潮位をブラウザの中で計算して表示します。JavaScript を有効にしてください。</p>
</noscript>

<!-- 日付。スクロールしても上に残る -->
<nav class="datebar" aria-label="日付の切り替え">
  <button class="nav" id="prev" aria-label="前の日">‹</button>
  <div class="dateface">
    <span class="d1" id="dateMain"></span>
    <span class="d2" id="dateSub"></span>
    <input type="date" id="picker" aria-label="日付を選ぶ">
  </div>
  <button class="nav" id="next" aria-label="次の日">›</button>
  <button class="today" id="todayBtn">今日</button>
</nav>

<main>
  <!-- 潮 -->
  <section class="view" id="viewTide">
    <section class="verdict" id="verdict" aria-live="polite"></section>
    <div id="recall"></div>
    <section class="now" id="now"></section>

    <div class="wrap">
      <div class="chartbox">
        <div class="chart" id="chart"></div>
        <div class="readout" id="readout"></div>
        <div class="legend">
          <span><span class="swatch" style="background:var(--gold)"></span>釣りどき</span>
          <span><span class="swatch" style="background:var(--accent)"></span>潮位</span>
          <span><span class="swatch" style="background:var(--night)"></span>夜間</span>
        </div>
      </div>

      <h2><button class="term" data-term="best">この日の釣りどき</button><span class="badge" id="dayBadge"></span></h2>
      <div id="slots"></div>

      <section id="weatherSec" hidden>
        <h2>天気と風</h2>
        <div class="weather" id="weather"></div>
        <p class="note" id="weatherNote"></p>
      </section>

      <h2><button class="term" data-term="hilo">満潮・干潮</button></h2>
      <table id="tideTable"></table>

      <h2>この日のデータ</h2>
      <dl class="meta" id="meta"></dl>

      <h2>いま釣れる魚</h2>
      <div class="fish" id="fishPreview"></div>
      <button class="btn grow" data-go="fish" style="margin-top:10px;width:100%">ほかの魚も見る</button>

      <section id="newsSec" hidden>
        <h2>釣りのニュース</h2>
        <ul class="news" id="news"></ul>
      </section>

      <footer>
        潮位は海上保安庁が公開する大分験潮所の調和定数から推算したものです。<br>
        <b>航行・安全の判断には使わないでください。</b><br>
        <button class="btn" data-panel="about" style="margin-top:12px">精度と出典について</button>
      </footer>
    </div>
  </section>

  <!-- 週 -->
  <section class="view wrap" id="viewWeek" hidden></section>

  <!-- 釣果 -->
  <section class="view wrap" id="viewLog" hidden></section>

  <!-- 魚 -->
  <section class="view wrap" id="viewFish" hidden></section>

  <!-- その他 -->
  <section class="view wrap" id="viewMore" hidden></section>
</main>

<!-- 下部のタブ -->
<nav class="tabbar" aria-label="画面の切り替え">
  <button data-tab="tide" aria-current="page"><span class="ic">🌊</span>潮</button>
  <button data-tab="week"><span class="ic">📅</span>週</button>
  <button data-tab="log"><span class="ic">📝</span>釣果</button>
  <button data-tab="fish"><span class="ic">🐟</span>魚</button>
  <button data-tab="more"><span class="ic">☰</span>その他</button>
</nav>

<!-- 全画面パネル（その他タブから開く） -->
<div class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="phead">
    <h3 id="panelTitle"></h3>
    <button class="icon-btn" id="panelClose" aria-label="閉じる">✕</button>
  </div>
  <div class="pbody" id="panelBody"></div>
</div>

<!-- 用語のボトムシート -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <h3 id="sheetTitle"></h3>
  <p id="sheetBody"></p>
  <button class="close" id="sheetClose">閉じる</button>
</div>

</body>
</html>
